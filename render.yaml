services:
  - type: web
    name: mortalidad-colombia-2019
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:server --workers 1 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DASH_DEBUG
        value: '0'
